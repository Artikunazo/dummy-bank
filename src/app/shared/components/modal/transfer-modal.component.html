
    @if (visible()) {
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/20 bg-black/70 backdrop-blur-sm animate-fade-in"
           role="dialog" aria-modal="true" aria-labelledby="transfer-modal-title">
        <div class="glass rounded-2xl w-full max-w-md p-6 shadow-2xl animate-fade-in-up">
          <div class="flex items-center justify-between mb-5">
            <h2 id="transfer-modal-title" class="text-white font-bold text-lg">Realizar Transferencia</h2>
            <button type="button" class="text-slate-400 text-slate-400 hover: hover:text-white transition-colors"
                    (click)="close()" aria-label="Cerrar">
              <i class="pi pi-times text-lg"></i>
            </button>
          </div>

          <form [formGroup]="transferForm" (ngSubmit)="submit()" class="space-y-4">
            <div>
              <label for="transfer-recipient" class="block text-slate-400 text-slate-400 text-sm mb-1.5">Número de tarjeta destino</label>
              <input id="transfer-recipient" type="text" formControlName="recipient"
                     class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-300 border-white/10
 text-white font-mono placeholder-slate-500
 focus:border-primary-500 focus:outline-none focus:ring-1 ring-primary-500"
                     placeholder="16 dígitos" maxlength="16" />
            </div>

            <div>
              <label for="transfer-amount" class="block text-slate-400 text-slate-400 text-sm mb-1.5">Monto (MXN)</label>
              <input id="transfer-amount" type="number" formControlName="amount"
                     class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-300 border-white/10
 text-white text-lg placeholder-slate-500
 focus:border-primary-500 focus:outline-none focus:ring-1 ring-primary-500"
                     placeholder="$0.00" />
              <p class="text-slate-500 text-xs mt-1">
                Límite: {{ card?.transferLimit | currencyMxn }}
              </p>
            </div>

            <div>
              <label for="transfer-desc" class="block text-slate-400 text-slate-400 text-sm mb-1.5">Concepto (opcional)</label>
              <input id="transfer-desc" type="text" formControlName="description"
                     class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-300 border-white/10
 text-white placeholder-slate-500
 focus:border-primary-500 focus:outline-none focus:ring-1 ring-primary-500"
                     placeholder="Ej. Pago de renta" />
            </div>

            @if (successMessage) {
              <p class="text-emerald-500 text-emerald-400 text-sm text-center">{{ successMessage }}</p>
            }
            @if (errorMessage) {
              <p class="text-crimson-500 text-crimson-400 text-sm text-center">{{ errorMessage }}</p>
            }

            <div class="flex gap-3 mt-4">
              <button type="button" (click)="close()"
                      class="flex-1 py-3 rounded-xl border border-slate-300 border-white/10 text-slate-400 text-slate-400
 hover: hover:text-white hover:border-slate-400 hover:border-white/30 transition-colors">
                Cancelar
              </button>
              <button type="submit"
                      [disabled]="transferForm.invalid || isProcessing"
                      class="flex-1 py-3 rounded-xl bg-primary-600 text-white font-semibold
 hover:bg-primary-700 transition-colors
 disabled:opacity-40 disabled:cursor-not-allowed">
                {{ isProcessing ? 'Procesando…' : 'Transferir' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    }
